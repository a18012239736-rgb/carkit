name: Build Windows executable
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import tomllib; from pathlib import Path; from engine import __version__; assert tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'] == __version__, 'Project version mismatch'; print(__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read a consistent application version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match application version v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "exe_name=carkit-$version.exe" >> $env:GITHUB_OUTPUT
          "setup_name=carkit-$version-setup.exe" >> $env:GITHUB_OUTPUT
      - name: Build and run regression tests
        shell: pwsh
        run: ./build/build_windows.ps1
      - name: Verify standalone startup
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'standalone'
          New-Item -ItemType Directory -Path $target | Out-Null
          $exeName = '${{ steps.version.outputs.exe_name }}'
          Copy-Item (Join-Path 'dist' $exeName) $target
          $app = Start-Process (Join-Path $target $exeName) -ArgumentList (Join-Path $target 'data') -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              $windows = Get-Process | Where-Object { $_.MainWindowTitle -like 'carkit*' }
              if ($windows) { $ready = $true; break }
              if ($app.HasExited) { throw "Application exited early: $($app.ExitCode)" }
            }
            if (-not $ready) { throw 'Application window did not appear within 120 seconds.' }
          } finally {
            taskkill /PID $app.Id /T /F
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $tool
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash -ne $expected) {
            throw 'Inno Setup installer did not match its pinned SHA-256.'
          }
          $toolSetup = Start-Process -FilePath $tool -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($toolSetup.ExitCode -ne 0) { throw "Unable to install Inno Setup: $($toolSetup.ExitCode)" }
          ./build/build_installer.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Verify installer and relaunch
        shell: pwsh
        run: |
          $setupExe = Join-Path (Get-Location) 'dist\${{ steps.version.outputs.setup_name }}'
          $target = Join-Path $env:RUNNER_TEMP 'carkit installed'
          $workdir = Join-Path $env:RUNNER_TEMP 'carkit 工作目录'
          $exe = Join-Path $target 'carkit.exe'
          $log = Join-Path $env:RUNNER_TEMP 'carkit-setup.log'
          $setupArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/RELAUNCH=1',
            "/DIR=""$target""", "/WORKDIR=""$workdir""", "/LOG=""$log""")
          $setup = Start-Process -FilePath $setupExe -ArgumentList $setupArgs -PassThru
          try {
            if (-not $setup.WaitForExit(120000)) { throw 'Installer timed out.' }
            if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)." }
            if (-not (Test-Path -LiteralPath (Join-Path $target 'carkit-installed.marker') -PathType Leaf)) {
              throw 'The installation marker is missing.'
            }
            if ((Get-FileHash -LiteralPath $exe).Hash -ne (Get-FileHash -LiteralPath 'dist\carkit.exe').Hash) {
              throw 'The installed executable differs from the portable build.'
            }
            for ($i = 0; $i -lt 60; $i++) {
              $windows = Get-Process -Name carkit -ErrorAction SilentlyContinue |
                Where-Object { $_.Path -eq $exe -and $_.MainWindowTitle -like 'carkit*' }
              if ($windows -and (Test-Path -LiteralPath (Join-Path $workdir 'raw') -PathType Container)) {
                break
              }
              Start-Sleep -Seconds 2
            }
            if ($i -eq 60) { throw 'The installed program did not relaunch with the supplied work directory.' }
          } catch {
            if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Tail 60 }
            throw
          } finally {
            if (-not $setup.HasExited) { taskkill /PID $setup.Id /T /F }
            Get-Process -Name carkit -ErrorAction SilentlyContinue |
              Where-Object { $_.Path -eq $exe } | Stop-Process -Force -ErrorAction SilentlyContinue
          }
      - name: Sign installer update manifest
        shell: pwsh
        env:
          CARKIT_UPDATE_SIGNING_KEY: ${{ secrets.CARKIT_UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:CARKIT_UPDATE_SIGNING_KEY) {
            if ($env:GITHUB_REF_TYPE -eq 'tag') { throw 'The CARKIT_UPDATE_SIGNING_KEY secret is required for a release.' }
            Write-Host 'Manual test build: no installer update manifest was signed.'
            exit 0
          }
          $version = '${{ steps.version.outputs.version }}'
          $notes = "docs/release-v$version.md"
          if (-not (Test-Path -LiteralPath $notes)) {
            $notes = 'dist/release-notes.md'
            Set-Content -LiteralPath $notes -Encoding utf8 -Value "carkit v$version"
          }
          .venv/Scripts/python.exe scripts/sign_installer_update.py --version $version --installer 'dist/${{ steps.version.outputs.setup_name }}' --notes $notes
          if ($LASTEXITCODE -ne 0) { throw 'Installer update signing failed.' }
          if (-not (Test-Path -LiteralPath 'dist/latest.json' -PathType Leaf) -or
              -not (Test-Path -LiteralPath 'dist/latest.json.sig' -PathType Leaf)) {
            throw 'Signing did not produce the installer update manifest and signature.'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: carkit-${{ steps.version.outputs.version }}-windows-x64
          path: dist/${{ steps.version.outputs.exe_name }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: carkit-${{ steps.version.outputs.version }}-windows-installer
          path: |
            dist/${{ steps.version.outputs.setup_name }}
            dist/latest.json
            dist/latest.json.sig
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exeName = '${{ steps.version.outputs.exe_name }}'
          $setupName = '${{ steps.version.outputs.setup_name }}'
          $notes = 'docs/release-v${{ steps.version.outputs.version }}.md'
          $notesArgs = if (Test-Path -LiteralPath $notes) { @('--notes-file', $notes) } else {
            @('--notes', "Windows 单文件版。下载 $exeName 后双击运行；carkit.exe 为相同内容的兼容文件名。")
          }
          gh release create $env:GITHUB_REF_NAME (Join-Path 'dist' $exeName) dist/carkit.exe `
            (Join-Path 'dist' $setupName) dist/latest.json dist/latest.json.sig `
            --title "产品小工具 $env:GITHUB_REF_NAME" `
            --verify-tag @notesArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
  build-macos:
    needs: build
    uses: ./.github/workflows/macos.yml
