name: Build macOS disk images
on:
  workflow_call:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read and validate version
        id: version
        run: |
          version="$(python -c 'import tomllib; from pathlib import Path; from engine import __version__; assert tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"] == __version__; print(__version__)')"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match application version v$version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=carkit-$version-${{ matrix.target }}.dmg" >> "$GITHUB_OUTPUT"
      - name: Install build dependencies
        run: python -m pip install pywebview playwright openpyxl lxml beautifulsoup4 cryptography pyinstaller pytest
      - name: Run regression tests
        run: python -m pytest tests -q
      - name: Build macOS application
        run: python -m PyInstaller build/carkit-macos.spec --noconfirm --clean
      - name: Create and inspect disk image
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
          TARGET_ARCH: ${{ matrix.target }}
        run: |
          set -euo pipefail
          app="dist/carkit.app"
          binary="$app/Contents/MacOS/carkit"
          test -d "$app"
          test -x "$binary"
          archs="$(lipo -archs "$binary")"
          if [[ "$TARGET_ARCH" == "macos-arm64" && "$archs" != *arm64* ]]; then
            echo "Expected arm64 app binary, got: $archs" >&2
            exit 1
          fi
          if [[ "$TARGET_ARCH" == "macos-x86_64" && "$archs" != *x86_64* ]]; then
            echo "Expected x86_64 app binary, got: $archs" >&2
            exit 1
          fi
          stage="$RUNNER_TEMP/carkit-dmg"
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -quiet -volname "carkit $APP_VERSION" -srcfolder "$stage" \
            -format UDZO -ov "dist/$ASSET_NAME"
          test -s "dist/$ASSET_NAME"
          shasum -a 256 "dist/$ASSET_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: carkit-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: dist/${{ steps.version.outputs.asset }}
          if-no-files-found: error
          retention-days: 30
      - name: Add disk image to the matching GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ steps.version.outputs.asset }}
        run: |
          # The Windows workflow creates the release. It may finish after this matrix build.
          for attempt in {1..30}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "dist/$ASSET_NAME" --clobber
              exit $?
            fi
            sleep 30
          done
          echo "No GitHub release appeared. The DMG remains available as this workflow's build artifact."
